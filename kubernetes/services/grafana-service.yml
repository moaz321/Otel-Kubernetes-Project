apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
  labels:
    helm.sh/chart: grafana-10.5.8
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: my-otel-demo
    app.kubernetes.io/version: 12.3.1
spec:
  type: ClusterIP
  ports:
  - name: service
    port: 80
    protocol: TCP
    targetPort: grafana
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: my-otel-demo
